<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{% endblock %}</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <!-- Local CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/output.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/style.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/guest.css') }}"
        />
    </head>
    <body class="bg-zinc-100">
        <!-- Navbar -->
        <nav
            class="w-full min-h-16 flex items-center justify-between py-0 px-5 shadow-lg sticky top-0 bg-white"
        >
            <div class="logo flex items-center justify-center gap-2.5">
                <span
                    class="material-symbols-rounded bg-zinc-800 text-white p-2 rounded-xl text-2xl"
                >
                    encrypted
                </span>
                <h2 class="text-zinc-800">Hello, Guest.</h2>
            </div>
            <a
                href="/pages/login"
                class="flex items-center justify-center gap-2.5 border border-zinc-200 rounded-2xl py-2.5 px-5 text-zinc-600"
            >
                <span class="material-symbols-rounded"> account_circle </span
                ><span>Login</span>
            </a>
        </nav>

        <!-- Main content -->
        <main class="w-full max-w-7xl h-auto p-2.5 block my-5 mx-auto">
            <header
                class="flex items-center justify-between flex-wrap border-b border-zinc-200 py-5 mb-5 gap-2.5"
            >
                <h2 class="text-zinc-800 text-3xl font-bold">Text Encryptor</h2>
                <form
                    action=""
                    method="post"
                    name="header-key-form"
                    id="header-key-form"
                >
                    <div
                        class="flex items-center justify-center gap-1.5 border border-zinc-200 py-2.5 px-5 rounded-2xl text-zinc-600"
                    >
                        <label for="encryption_key">Key:</label>
                        <input
                            type="text"
                            placeholder="Enter encryption key here"
                            name="encryption_key"
                            id="encryption_key"
                            class="h-6 outline-0 text-zinc-500"
                        />
                        <div class="buttons flex items-center gap-2.5">
                            <button
                                type="submit"
                                class="w-6 h-6 leading-6 cursor-pointer"
                                title="Proceed"
                            >
                                <span class="material-symbols-rounded">
                                    arrow_forward
                                </span>
                            </button>
                            <button
                                type="button"
                                class="w-6 h-6 leading-6 cursor-pointer"
                                title="Generate key"
                                onclick="generateEncryptionKey()"
                            >
                                <span class="material-symbols-rounded">
                                    wand_stars
                                </span>
                            </button>
                        </div>
                    </div>
                </form>
            </header>

            <!-- Main Section -->
            {% block section %}{% endblock %}
        </main>
        <!-- Toast -->
        <div
            id="toast-default"
            class="hidden absolute bottom-5 left-5 flex items-center w-full max-w-xs p-4 dark:text-zinc-500 dark:bg-white rounded-lg shadow-sm text-zinc-400 bg-zinc-800"
            role="alert"
        >
            <div
                class="inline-flex items-center justify-center shrink-0 w-8 h-8 dark:text-blue-500 dark:bg-blue-100 rounded-lg bg-blue-800 text-blue-200"
            >
                <span class="material-symbols-rounded"> info_i </span>
                <span class="sr-only">Info icon</span>
            </div>
            <div class="ms-3 text-sm font-normal" id="toast-message">
                Set yourself free.
            </div>
            <button
                type="button"
                class="cursor-pointer ms-auto -mx-1.5 -my-1.5 dark:bg-white dark:text-zinc-400 dark:hover:text-zinc-900 rounded-lg focus:ring-2 focus:ring-zinc-300 p-1.5 dark:hover:bg-zinc-100 inline-flex items-center justify-center h-8 w-8 text-zinc-500 hover:text-white bg-zinc-800 hover:bg-zinc-700"
                onclick="dismisToast()"
            >
                <span class="sr-only">Close</span>
                <span class="material-symbols-rounded"> close </span>
            </button>
        </div>
        <!-- Script -->
        <script src="{{ url_for('static', filename='scripts/script.js') }}"></script>
        <script>
            const keyPopupModal = document.getElementById("key_popup_modal");
            const headerKeyForm = document.getElementById("header-key-form");
            const key_api_uri = "/api/encryptor/encryption_key";

            // Check if encryption key has been set
            function checkEncryptionKey() {
                const encryptionKey = sessionStorage.getItem("encryption_key");
                if (encryptionKey) {
                    keyPopupModal.classList.add("hidden");
                    headerKeyForm.encryption_key.value = encryptionKey;
                } else {
                    fetch(key_api_uri, {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    })
                        .then(async (response) => {
                            const data = await response.json();

                            if (!response.ok) {
                                throw new Error(
                                    "Failed to fetch API" || data.message,
                                );
                            }
                            return data;
                        })
                        .then((data) => {
                            const serverKey = data.data.key;
                            sessionStorage.setItem("encryption_key", serverKey);

                            keyPopupModal.classList.add("hidden");
                            headerKeyForm.encryption_key.value = serverKey;
                        })
                        .catch((error) => {
                            keyPopupModal.classList.remove("hidden");
                            headerKeyForm.encryption_key.value = "";

                            showToast("An error has occurred.");
                            console.error(error);
                        });
                }
            }

            // Generate Encryption Key
            function generateEncryptionKey() {
                fetch(key_api_uri, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ key: "" }),
                })
                    .then(async (response) => {
                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                "Failed to fetch API" || data.message,
                            );
                        }
                        return data;
                    })
                    .then((data) => {
                        sessionStorage.setItem("encryption_key", data.data.key);
                        showToast("Key generated");
                        checkEncryptionKey();
                    })
                    .catch((error) => {
                        showToast("An error has occurred.");
                        console.error(error);
                    });
            }

            checkEncryptionKey();
        </script>
        {% block script %}{% endblock %}
    </body>
</html>
