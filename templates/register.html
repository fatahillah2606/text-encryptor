<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <!-- Local CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/output.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/style.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/login.css') }}"
        />
    </head>
    <body class="w-full h-screen flex items-center justify-center p-3">
        <!-- Login box -->
        <div
            class="login-box w-full max-w-md h-auto rounded-[30px] shadow-lg p-5"
        >
            <div
                class="icon block my-5 mx-auto bg-white dark:bg-zinc-800 rounded-[20px] w-14 h-14 shadow-lg"
            >
                <span
                    class="material-symbols-rounded text-4xl leading-14! block! text-center! text-zinc-800 dark:text-white"
                >
                    person_add
                </span>
            </div>
            <h2
                class="text-center text-zinc-800 dark:text-zinc-200 font-bold text-xl"
            >
                Let's sign up!
            </h2>
            <p class="text-center mt-3 text-zinc-600 dark:text-zinc-300">
                Register to use the password manager feature. Or you can choose
                another option using the button below.
            </p>

            <!-- Form -->
            <form
                action=""
                method="post"
                name="register_form"
                id="register_form"
                class="my-5 mx-0 w-full flex flex-col gap-3"
            >
                <!-- Username -->
                <div class="grid gap-4 mb-4 grid-cols-2">
                    <div
                        class="col-span-2 sm:col-span-1 flex items-center rounded-2xl bg-slate-100 dark:bg-zinc-800 relative"
                    >
                        <span
                            class="material-symbols-rounded w-12 block! text-center! text-zinc-600 dark:text-zinc-300"
                        >
                            person
                        </span>
                        <input
                            type="text"
                            name="name"
                            id="name"
                            maxlength="60"
                            placeholder="Your name"
                            class="w-full text-base py-4 px-0 text-zinc-600 dark:text-zinc-300 outline-none"
                            required
                        />
                    </div>
                    <div
                        class="col-span-2 sm:col-span-1 flex items-center rounded-2xl bg-slate-100 dark:bg-zinc-800 relative"
                    >
                        <span
                            class="material-symbols-rounded w-12 block! text-center! text-zinc-600 dark:text-zinc-300"
                        >
                            person
                        </span>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            maxlength="60"
                            placeholder="Username"
                            class="w-full text-base py-4 px-0 text-zinc-600 dark:text-zinc-300 outline-none"
                            required
                        />
                    </div>
                </div>
                <!-- Password -->
                <div
                    class="w-full flex items-center rounded-2xl bg-slate-100 dark:bg-zinc-800 relative"
                >
                    <span
                        class="material-symbols-rounded w-12 block! text-center! text-zinc-600 dark:text-zinc-300"
                    >
                        key
                    </span>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        class="w-full text-base py-4 px-0 text-zinc-600 dark:text-zinc-300 outline-none"
                        required
                    />
                </div>
                <div
                    class="w-full flex items-center rounded-2xl bg-slate-100 dark:bg-zinc-800 relative"
                >
                    <span
                        class="material-symbols-rounded w-12 block! text-center! text-zinc-600 dark:text-zinc-300"
                    >
                        key
                    </span>
                    <input
                        type="password"
                        name="retype_password"
                        id="retype_password"
                        placeholder="Retype Password"
                        class="w-full text-base py-4 px-0 text-zinc-600 dark:text-zinc-300 outline-none"
                        required
                    />
                </div>
                <div class="flex items-center ml-3">
                    <input
                        id="show_pw"
                        type="checkbox"
                        value=""
                        onchange="
                            showPasswordCheckBox(this, [
                                'password',
                                'retype_password',
                            ])
                        "
                        class="w-4 h-4 text-blue-600 bg-zinc-100 border-zinc-300 rounded-sm focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-zinc-800 focus:ring-2 dark:bg-zinc-700 dark:border-zinc-600"
                    />
                    <label
                        for="show_pw"
                        class="ms-2 text-sm font-medium text-zinc-900 dark:text-zinc-400"
                        >Show password</label
                    >
                </div>
                <p
                    class="support-text hidden text-red-600 dark:text-red-500 m-0 ml-3 text-xs text-left"
                >
                    Support Text
                </p>
                <button
                    type="submit"
                    class="py-4 rounded-2xl text-white text-base cursor-pointer mt-5 focus:scale-95"
                >
                    Register
                </button>
            </form>
            <div
                class="flex items-center justify-center relative mb-5"
                id="or-text"
            >
                <span
                    class="z-10 bg-white dark:bg-zinc-900 w-12 block text-center text-zinc-600 dark:text-zinc-300"
                    >Or</span
                >
            </div>

            <!-- Other option -->
            <div class="flex items-center justify-center gap-5 mb-5">
                <a
                    href="/pages/guest/text-encryptor"
                    class="flex items-center justify-center gap-3 shadow-md bg-white hover:bg-slate-100 dark:bg-zinc-800 dark:hover:bg-zinc-700 py-3 px-5 rounded-2xl w-full text-zinc-600! dark:text-zinc-300!"
                >
                    <span class="material-symbols-rounded"> encrypted </span>
                    <span>Encryptor</span>
                </a>
                <a
                    href="/pages/login"
                    class="flex items-center justify-center gap-3 shadow-md bg-white hover:bg-slate-100 dark:bg-zinc-800 dark:hover:bg-zinc-700 py-3 px-5 rounded-2xl w-full text-zinc-600! dark:text-zinc-300!"
                >
                    <span class="material-symbols-rounded"> login </span>
                    <span>Login</span>
                </a>
            </div>
        </div>
        <!-- Scripts -->
        <script src="{{ url_for('static', filename='scripts/script.js') }}"></script>
        <script>
            const regist_api = "/api/auth/register";
            const registerForm = document.getElementById("register_form");
            const supportText = document.querySelector(".support-text");

            function register(formulir) {
                let formData = new FormData(formulir);
                formData = Object.fromEntries(formData.entries());

                fetch(regist_api, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(formData),
                })
                    .then(async (response) => {
                        const data = await response.json();
                        if (!response.ok) {
                            throw new Error(
                                data.message ||
                                    `Failed to fetch API: ${regist_api}`,
                            );
                        }
                        return data;
                    })
                    .then((data) => {
                        location.href = "/pages/dashboard";
                    })
                    .catch((error) => {
                        showSupportText(showSupportText, error);
                        console.error(error);
                    });
            }

            registerForm.addEventListener("submit", (event) => {
                event.preventDefault();
                hideSupportText(supportText);

                if (
                    registerForm.password.value ===
                    registerForm.retype_password.value
                ) {
                    register(registerForm);
                } else {
                    showSupportText(
                        supportText,
                        "The password does not match!",
                    );
                }
            });
        </script>
    </body>
</html>
