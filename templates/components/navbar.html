<div
    class="w-full h-18 bg-md-surface-container flex items-center justify-between z-20"
>
    <!-- Icon and lable -->
    <div class="flex items-center justify-start">
        <div class="w-16 md:w-22 flex items-center justify-center">
            <md-icon
                class="text-center w-12 h-12 rounded-xl md:bg-md-on-primary text-md-secondary! hidden md:block"
            >
                encrypted
            </md-icon>

            <md-icon-button class="md:hidden cursor-pointer" id="menu-btn">
                <md-icon class="text-md-secondary!"> menu </md-icon>
            </md-icon-button>
        </div>

        <!-- The lable -->
        <span
            class="md-typescale-title-large text-md-secondary hidden sm:block"
        >
            Text Encryptor
        </span>

        <!-- Icon for small screen -->
        <md-icon
            class="text-center w-12 h-12 rounded-xl bg-md-on-primary text-md-secondary! sm:hidden"
        >
            encrypted
        </md-icon>
    </div>

    <!-- User profile -->
    <div class="relative flex items-center justify-center mr-5 gap-2.5">
        <md-icon-button onclick="openKeyModal()">
            <md-icon>key_vertical</md-icon>
        </md-icon-button>
        {% if 'username' in session %}
        <div
            class="flex items-center justify-center bg-md-on-primary cursor-pointer rounded-full w-11 h-11 ml-1"
            title="Account information"
            id="user-profile"
        >
            <span class="text-md-secondary font-bold text-lg">
                {{ name[0] }}
            </span>
        </div>

        <!-- Profile menu -->
        <md-menu id="profile-menu" anchor="user-profile">
            <md-menu-item onclick="logout()">
                <md-icon slot="start">logout</md-icon>
                <div slot="headline">Logout</div>
            </md-menu-item>
        </md-menu>
        {% else %}
        <a href="/pages/login">
            <md-filled-button>Login</md-filled-button>
        </a>
        {% endif %}
    </div>
</div>
