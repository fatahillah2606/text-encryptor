<md-dialog type="alert" id="alert-dialog">
    <div slot="headline">Alert dialog</div>
    <form id="alert_form" slot="content" method="dialog">
        This is a standard alert dialog. Alert dialogs interrupt users with
        urgent information, details, or actions.
    </form>
    <div slot="actions">
        <md-text-button form="alert_form" value="ok">OK</md-text-button>
    </div>
</md-dialog>
