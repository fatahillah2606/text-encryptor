{% extends 'base.html' %}

<!-- Title -->
{% block title %}Text Decryptor{% endblock %}

<!-- Section -->
{% block section %}
<section class="flex">
    <!-- Sidebar -->
    {% include 'sidebar.html' %}
    <section class="w-full h-auto flex flex-col gap-5 relative">
        <div
            class="w-full h-auto border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 rounded-2xl"
        >
            <h2
                class="text-lg text-zinc-800 dark:text-zinc-200 font-semibold p-5 border-b border-zinc-200 dark:border-zinc-700"
            >
                Decrypt text
            </h2>
            <div>
                <form
                    action=""
                    method="post"
                    name="decryption-form"
                    id="decryption-form"
                >
                    <textarea
                        name="encrypted_text"
                        id="encrypted_text"
                        placeholder="Enter the text you want to Decrypt"
                        class="w-full h-full min-h-52 p-2.5 resize-none text-zinc-600 dark:text-zinc-300 outline-0"
                    ></textarea>
                    <button
                        type="submit"
                        class="flex items-center justify-center gap-2.5 cursor-pointer m-5 text-white bg-linear-to-r from-blue-500 via-blue-600 to-blue-700 hover:bg-linear-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
                    >
                        <span class="material-symbols-rounded">
                            lock_open_right
                        </span>
                        <span>Decrypt</span>
                    </button>
                </form>
            </div>
        </div>
        <div
            class="w-full h-auto border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 rounded-2xl"
        >
            <h2
                class="text-lg text-zinc-800 dark:text-zinc-200 font-semibold p-5 border-b border-zinc-200 dark:border-zinc-700"
            >
                Decrypted text
            </h2>
            <div class="relative">
                <textarea
                    name="result"
                    id="result"
                    placeholder="Decrypted text will shown here"
                    class="w-full h-full min-h-52 p-2.5 resize-none text-zinc-600 dark:text-zinc-300 outline-0"
                    readonly
                ></textarea>
                <span
                    class="material-symbols-rounded absolute top-1.5 right-0 text-lg! px-1.5 py-1 bg-white dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 mr-2.5 cursor-pointer"
                    onclick="copyText('result')"
                >
                    file_copy
                </span>
            </div>
        </div>
    </section>
</section>
{% endblock %}

<!-- Script -->
{% block script %}
<script>
    const decryptionForm = document.getElementById("decryption-form");
    const resultField = document.getElementById("result");
    const decrypt_api = "/api/encryptor/decrypt_text";

    async function decryptText() {
        let encryptionKey = sessionStorage.getItem("encryption_key");
        encryptionKey = JSON.parse(encryptionKey);

        let formData = new FormData(decryptionForm);
        formData.append("key", encryptionKey.key);
        formData = Object.fromEntries(formData.entries());

        // send request
        try {
            const result = await sendRequest(decrypt_api, formData, "POST");

            resultField.value = result.data.decrypted_text;

            showToast(result.message);
        } catch (error) {
            showToast(error);
            console.error(error);
        }
    }

    decryptionForm.addEventListener("submit", (event) => {
        event.preventDefault();
        decryptText();
    });
</script>
{% endblock %}
