<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{% endblock %} | {{ name }}</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <!-- Local CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/output.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/style.css') }}"
        />

        <!-- Tailwind CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-zinc-100 dark:bg-zinc-900">
        <!-- Navbar -->
        <nav
            class="w-full min-h-16 flex items-center justify-between py-0 px-5 shadow-lg sticky top-0 bg-white dark:bg-zinc-800 z-50"
        >
            <div class="logo flex items-center justify-center gap-2.5">
                <span
                    class="material-symbols-rounded bg-zinc-800 dark:bg-white text-white dark:text-zinc-800 p-2 rounded-xl text-2xl material-icon-fill"
                >
                    encrypted
                </span>
                <h2 class="text-zinc-800 dark:text-zinc-200">
                    Hello, {{ name }}.
                </h2>
            </div>
            <div
                class="relative group flex items-center justify-center gap-2.5 border border-zinc-200 hover:border-zinc-400 dark:border-zinc-700 dark:hover:border-zinc-500 rounded-2xl py-2.5 px-5 text-zinc-600 dark:text-zinc-300"
            >
                <span class="material-symbols-rounded"> account_circle </span
                ><span>{{ username }}</span>
                <span
                    class="material-symbols-rounded group-hover:rotate-180 transition-all ease"
                >
                    arrow_drop_down
                </span>

                <!-- drop menu -->
                <div
                    class="absolute top-full left-1/2 -translate-x-1/2 w-full hidden group-hover:block"
                >
                    <div
                        class="block m-auto -mb-1.5 w-3 h-3 bg-white dark:bg-zinc-700 rotate-45"
                    ></div>
                    <button
                        onclick="logout()"
                        class="w-full cursor-pointer bg-white dark:bg-zinc-700 text-zinc-700 dark:text-zinc-300 flex items-center justify-start gap-2.5 py-2 px-5 text-center rounded-xl shadow-md"
                    >
                        <span class="material-symbols-rounded"> logout </span>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="w-full max-w-7xl h-auto p-2.5 block my-5 mx-auto">
            <header
                class="flex items-center justify-between flex-wrap border-b border-zinc-200 dark:border-zinc-700 py-5 mb-5 gap-2.5"
            >
                <h2 class="text-zinc-800 dark:text-zinc-200 text-3xl font-bold">
                    Text Encryptor
                </h2>
                <div
                    class="flex items-center justify-center gap-1.5 rounded-2xl text-zinc-600 dark:text-zinc-300"
                >
                    <label>Key:</label>
                    <select
                        class="bg-white border border-zinc-200 text-zinc-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-zinc-800 dark:border-zinc-700 dark:placeholder-zinc-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        id="key-selector"
                    >
                        <option value="{{ key }}" selected>Master key</option>
                        {% for key in user_keys %}
                        <option value="{{ key['encrypted_key'] }}">
                            {{ key['key_name'] }}
                        </option>
                        {% endfor %}
                        <option value="manual">Manual input key</option>
                    </select>
                    <form
                        action=""
                        name="manual_key_form"
                        id="manual_key_form"
                        class="min-w-72 flex items-center gap-1.5 hidden"
                    >
                        <input
                            type="text"
                            id="manual_key"
                            name="manual_key"
                            placeholder="Enter encryption key here"
                            required
                            class="bg-white border border-zinc-200 text-zinc-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-zinc-800 dark:border-zinc-700 dark:placeholder-zinc-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        />
                        <div
                            class="flex items-center bg-white border border-zinc-200 dark:bg-zinc-800 dark:border-zinc-700 rounded-lg h-10.5 overflow-hidden"
                        >
                            <button
                                type="submit"
                                title="Set key"
                                class="w-12 h-10.5 flex items-center justify-center cursor-pointer active:bg-zinc-200 dark:active:bg-zinc-600"
                            >
                                <span class="material-symbols-rounded">
                                    arrow_forward
                                </span>
                            </button>
                            <button
                                type="button"
                                title="Generate key"
                                class="w-12 h-10.5 flex items-center justify-center cursor-pointer active:bg-zinc-200 dark:active:bg-zinc-600"
                                onclick="setEncryptionKey('')"
                            >
                                <span class="material-symbols-rounded">
                                    wand_stars
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </header>

            <!-- Main Section -->
            {% block section %}{% endblock %}
        </main>
        <!-- Toast -->
        <div
            id="toast-default"
            class="hidden fixed bottom-5 left-5 flex items-center w-full max-w-xs p-4 dark:text-zinc-500 dark:bg-white rounded-lg shadow-sm text-zinc-400 bg-zinc-800 z-100"
            role="alert"
        >
            <div class="ms-3 text-sm font-normal" id="toast-message">
                Set yourself free.
            </div>
            <button
                type="button"
                class="cursor-pointer ms-auto -mx-1.5 -my-1.5 dark:bg-white dark:text-zinc-400 dark:hover:text-zinc-900 rounded-lg focus:ring-2 focus:ring-zinc-300 p-1.5 dark:hover:bg-zinc-100 inline-flex items-center justify-center h-8 w-8 text-zinc-500 hover:text-white bg-zinc-800 hover:bg-zinc-700"
                onclick="dismisToast()"
            >
                <span class="sr-only">Close</span>
                <span class="material-symbols-rounded"> close </span>
            </button>
        </div>

        <!-- Modals -->
        {% block modals %}{% endblock %}
        <!-- Scripts -->
        <script src="{{ url_for('static', filename='scripts/api.js') }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
        <script src="{{ url_for('static', filename='scripts/script.js') }}"></script>
        <script>
            const keySelector = document.getElementById("key-selector");
            const manualKeyForm = document.getElementById("manual_key_form");

            // API URI
            const userKeysAPI = "/api/user/keys";

            // Check encryption key
            async function checkEncryptionKey() {
                let encryptionKey = sessionStorage.getItem("encryption_key");
                if (encryptionKey) {
                    encryptionKey = JSON.parse(encryptionKey);

                    // Set the key selector value
                    setKeySelectorValue(encryptionKey.key);

                    // If the value was manual
                    if (keySelector.value == "manual") {
                        manualKeyForm.manual_key.value = encryptionKey.key;
                        manualKeyForm.classList.remove("hidden");
                    } else {
                        manualKeyForm.classList.add("hidden");
                    }
                } else {
                    try {
                        const result = await sendRequest(
                            userKeysAPI,
                            {},
                            "GET",
                        );
                        const masterKey = result.data[0];

                        saveKeyToSession(masterKey);
                        checkEncryptionKey();
                    } catch (error) {
                        showToast(error);
                        console.error(error);
                    }
                }
            }

            // Set encryption key
            async function changeActiveKey(keyValue, keyName) {
                if (keyValue == "manual") {
                    manualKeyForm.classList.remove("hidden");
                } else {
                    keyData = {
                        name: keyName,
                        key: keyValue,
                    };

                    sessionStorage.setItem(
                        "encryption_key",
                        JSON.stringify(keyData),
                    );
                }
            }

            // keySelector listener
            keySelector.addEventListener("change", () => {
                if (keySelector.value == "manual") {
                    manualKeyForm.classList.remove("hidden");
                } else {
                    manualKeyForm.classList.add("hidden");
                }

                let theOption = keySelector.querySelector("option:checked");
                changeActiveKey(theOption.value, theOption.textContent);
            });

            // Set value of keySelector
            function setKeySelectorValue(targetValue) {
                const availableValues = Array.from(keySelector.options).map(
                    (opt) => opt.value,
                );

                // Check if value is available
                if (availableValues.includes(targetValue)) {
                    keySelector.value = targetValue;
                } else {
                    keySelector.value = "manual";
                }
            }

            manualKeyForm.addEventListener("submit", (event) => {
                event.preventDefault();

                setEncryptionKey(manualKeyForm.manual_key.value);
            });

            checkEncryptionKey();
        </script>
        {% block script %}{% endblock %}
    </body>
</html>
